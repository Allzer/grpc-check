syntax="proto3";

service Greeter {
    rpc SayHello (HelloRequest) returns (HelloResponse);
}

message HelloRequest {
    string name = 1;
}

message HelloResponse {
    string message = 1;
}

service Squaring {
    rpc SquaringNumber (SquaringRequest) returns (SquaringResponse);
    rpc CubeOfNumbers (SquaringRequest) returns (SquaringResponse);
}

message SquaringRequest {
    int32 number = 1;
}

message SquaringResponse {
    int32 squaring_number = 1;
}